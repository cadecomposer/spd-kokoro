# spd_kokoro -- Speech Dispatcher output module for Kokoro TTS
#
# Installed as:  ~/.config/speech-dispatcher/modules/kokoro.conf
# AddModule:     AddModule "kokoro" "spd_kokoro" "kokoro.conf"
#
# Values use "Key value" syntax.  Quotes are optional unless the value
# contains spaces.  See README.md for details.

# OpenAI-compatible speech endpoint.
KokoroURL "http://localhost:8880/v1/audio/speech"

# Voice-list endpoint.  Leave empty to derive it from KokoroURL
# (.../v1/audio/speech -> .../v1/audio/voices).
KokoroVoicesURL ""

# Optional bearer token, for a non-local endpoint that requires auth.
KokoroAPIKey ""

# Model name sent to the endpoint.  kokoro-fastapi accepts "kokoro",
# "tts-1", "tts-1-hd", and "gpt-4o-mini-tts".
KokoroModel "kokoro"

# Default voice.  Individual clients can still choose another voice with
# spd-say -y VOICE, or via the synthesis voice in their SSIP settings.
# Good defaults: af_heart (en-US female), am_michael (en-US male),
# bf_alice (en-GB female), bm_george (en-GB male).
KokoroVoice "af_heart"

# Always speak with KokoroVoice, ignoring any voice or language a client
# requests (e.g. Firefox Reader Mode picking a different "default" voice).
# Set to 1 to force the voice below for every client.  If KokoroVoice is not
# a known voice, client selection is used as a fallback.
KokoroPinVoice 0

# Firefox's Reader Mode "Narrate" menu labels every voice with its language
# on Linux, so all voices of one language look identical there.  Set this to
# 1 to report tags like "en-US-x-af-heart", which Narrate shows as
# "English (en-US-x-af-heart)".  Other clients see the same tags, so this is
# off by default.  See README.md ("Firefox Reader Mode (Narrate)").
KokoroUniqueLangTags 0

# wav is lossless and needs no decoder; mp3/opus also work if the player
# and endpoint support them.
KokoroFormat "wav"

# Seconds to wait for synthesis.
KokoroTimeout 60

# Long text is split into chunks at sentence boundaries.  Smaller chunks
# start speaking sooner; larger chunks sound more continuous.
KokoroChunkChars 600

# Audio player.  "auto" picks the first available of:
# pw-play, paplay, mpv, ffplay, aplay.
# Set an absolute path to force a particular player.
KokoroPlayer "auto"

# Extra player arguments inserted before the filename.  Examples:
#   KokoroPlayerArgs "--target alsa_output.pci-0000_00_1f.3.analog-stereo"
#   KokoroPlayerArgs "--device=@DEFAULT_SINK@"
KokoroPlayerArgs ""

# Extra master gain (0.0 - 1.0) applied on top of Speech Dispatcher's
# volume setting.
KokoroVolume 1.0

# Speech Dispatcher rate (-100..100) is mapped to Kokoro's speed
# parameter (2^(rate/100)), then clamped to this range.
KokoroMinSpeed 0.5
KokoroMaxSpeed 2.0

# Optional debug log.  Empty disables logging.  The module's stderr is
# usually discarded by Speech Dispatcher, so set a file here when
# troubleshooting.
# KokoroLog "/tmp/spd-kokoro.log"
KokoroLog ""
